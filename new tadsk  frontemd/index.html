<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        class CustomMatch {
            constructor(initialValue = 0) {
                this.value = initialValue;
            }

            plus(num) {
                this.value += num;
                return this;
            }

            minus(num) {
                this.value -= num;
                return this;
            }

            multiply(num) {
                this.value *= num;
                return this;
            }

            divide(num) {
                if (num !== 0) {
                    this.value /= num;
                }
                return this;
            }
        }

        var result = new CustomMatch(50).plus(6).minus(30).multiply(3).divide(2);
        console.log(result.value); 
    </script>

</body>
</html>
